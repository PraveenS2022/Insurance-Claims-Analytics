<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Claim Amount by Age Group</title>
  <desc id="desc">Line chart showing claim trends across age groups.</desc>
  <rect width="1400" height="780" fill="#f2f2f2"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Claim Amount by Age Group</text>

  <g stroke="#333333" stroke-width="1.3">
    <line x1="90" y1="660" x2="1310" y2="660"/>
    <line x1="90" y1="120" x2="90" y2="660"/>
  </g>

  <g stroke="#c9c9c9" stroke-width="1">
    <line x1="90" y1="610" x2="1310" y2="610"/>
    <line x1="90" y1="560" x2="1310" y2="560"/>
    <line x1="90" y1="510" x2="1310" y2="510"/>
    <line x1="90" y1="460" x2="1310" y2="460"/>
    <line x1="90" y1="410" x2="1310" y2="410"/>
    <line x1="90" y1="360" x2="1310" y2="360"/>
    <line x1="90" y1="310" x2="1310" y2="310"/>
    <line x1="90" y1="260" x2="1310" y2="260"/>
    <line x1="90" y1="210" x2="1310" y2="210"/>
    <line x1="90" y1="160" x2="1310" y2="160"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#333333">
    <text x="230" y="700" text-anchor="middle">18-25</text>
    <text x="430" y="700" text-anchor="middle">26-35</text>
    <text x="630" y="700" text-anchor="middle">36-45</text>
    <text x="830" y="700" text-anchor="middle">46-55</text>
    <text x="1030" y="700" text-anchor="middle">56+</text>
  </g>

  <polyline fill="none" stroke="#7c3aed" stroke-width="6" points="230,380 430,300 630,230 830,360 1030,420"/>

  <g fill="#7c3aed">
    <circle cx="230" cy="380" r="8"/>
    <circle cx="430" cy="300" r="8"/>
    <circle cx="630" cy="230" r="8"/>
    <circle cx="830" cy="360" r="8"/>
    <circle cx="1030" cy="420" r="8"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">
    <text x="230" y="360" text-anchor="middle">$9.2k</text>
    <text x="430" y="280" text-anchor="middle">$11.4k</text>
    <text x="630" y="210" text-anchor="middle">$12.1k</text>
    <text x="830" y="340" text-anchor="middle">$10.9k</text>
    <text x="1030" y="400" text-anchor="middle">$9.5k</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">
    <text x="90" y="150" transform="rotate(-90 90 150)" text-anchor="middle">Average Claim Amount</text>
  </g>
</svg>
