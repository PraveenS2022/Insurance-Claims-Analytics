<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Average Claim Amount by Region</title>
  <desc id="desc">Bar chart showing average claim amounts across Northeast, Southeast, Southwest, and Northwest.</desc>
  <rect width="1400" height="780" fill="#f2f2f2"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Average Claim Amount by Region</text>

  <g stroke="#333333" stroke-width="1.3">
    <line x1="90" y1="660" x2="1310" y2="660"/>
    <line x1="90" y1="120" x2="90" y2="660"/>
  </g>

  <g stroke="#c9c9c9" stroke-width="1">
    <line x1="90" y1="610" x2="1310" y2="610"/>
    <line x1="90" y1="560" x2="1310" y2="560"/>
    <line x1="90" y1="510" x2="1310" y2="510"/>
    <line x1="90" y1="460" x2="1310" y2="460"/>
    <line x1="90" y1="410" x2="1310" y2="410"/>
    <line x1="90" y1="360" x2="1310" y2="360"/>
    <line x1="90" y1="310" x2="1310" y2="310"/>
    <line x1="90" y1="260" x2="1310" y2="260"/>
    <line x1="90" y1="210" x2="1310" y2="210"/>
    <line x1="90" y1="160" x2="1310" y2="160"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">
    <text x="220" y="700" text-anchor="middle">northeast</text>
    <text x="510" y="700" text-anchor="middle">southeast</text>
    <text x="820" y="700" text-anchor="middle">southwest</text>
    <text x="1110" y="700" text-anchor="middle">northwest</text>
  </g>

  <g>
    <rect x="160" y="160" width="120" height="500" fill="#1f77b4" opacity="0.9"/>
    <rect x="450" y="240" width="120" height="420" fill="#1f77b4" opacity="0.9"/>
    <rect x="740" y="260" width="120" height="400" fill="#1f77b4" opacity="0.9"/>
    <rect x="1030" y="300" width="120" height="360" fill="#1f77b4" opacity="0.9"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">
    <text x="220" y="150" text-anchor="middle">16,889</text>
    <text x="510" y="230" text-anchor="middle">13,059</text>
    <text x="820" y="250" text-anchor="middle">12,687</text>
    <text x="1110" y="290" text-anchor="middle">11,613</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">
    <text x="90" y="150" transform="rotate(-90 90 150)" text-anchor="middle">Average Claim Amount</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333333">
    <text x="700" y="748" text-anchor="middle">Highest average claim: Northeast ($16,889.04)</text>
  </g>
</svg>
