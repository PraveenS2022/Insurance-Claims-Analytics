<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Average Claim Amount by Smoking Status</title>
  <desc id="desc">Bar chart comparing average claim amounts for non-smokers and smokers.</desc>
  <rect width="1400" height="780" fill="#f2f2f2"/>

  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Average Claim Amount by Smoking Status</text>

  <g stroke="#333333" stroke-width="1.3">
    <line x1="90" y1="660" x2="1310" y2="660"/>
    <line x1="90" y1="120" x2="90" y2="660"/>
  </g>

  <g stroke="#c9c9c9" stroke-width="1">
    <line x1="90" y1="610" x2="1310" y2="610"/>
    <line x1="90" y1="560" x2="1310" y2="560"/>
    <line x1="90" y1="510" x2="1310" y2="510"/>
    <line x1="90" y1="460" x2="1310" y2="460"/>
    <line x1="90" y1="410" x2="1310" y2="410"/>
    <line x1="90" y1="360" x2="1310" y2="360"/>
    <line x1="90" y1="310" x2="1310" y2="310"/>
    <line x1="90" y1="260" x2="1310" y2="260"/>
    <line x1="90" y1="210" x2="1310" y2="210"/>
    <line x1="90" y1="160" x2="1310" y2="160"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#333333">
    <text x="90" y="688" text-anchor="middle">0</text>
    <text x="340" y="688" text-anchor="middle">5000</text>
    <text x="590" y="688" text-anchor="middle">10000</text>
    <text x="840" y="688" text-anchor="middle">15000</text>
    <text x="1090" y="688" text-anchor="middle">20000</text>
    <text x="1340" y="688" text-anchor="middle">25000</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#333333">
    <text x="260" y="700" text-anchor="middle">Non-Smoker</text>
    <text x="1040" y="700" text-anchor="middle">Smoker</text>
  </g>

  <g>
    <rect x="220" y="220" width="330" height="440" fill="#1f77b4" opacity="0.9"/>
    <rect x="900" y="120" width="330" height="540" fill="#1f77b4" opacity="0.9"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">
    <text x="385" y="205" text-anchor="middle">8,421</text>
    <text x="1065" y="110" text-anchor="middle">32,050</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">
    <text x="700" y="734" text-anchor="middle">Observed average claim for smokers is approximately 3.8x the non-smoker average in this dataset.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">
    <text x="90" y="150" transform="rotate(-90 90 150)" text-anchor="middle">Average Claim Amount</text>
  </g>
</svg>
